# Перевірка при кожній зміні: модульні тести, наскрізний тест у браузері,
# і що закомічені dist/*.html зібрано саме з цього коду.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Модульні тести
        run: npm test

      - name: Playwright і Chromium для наскрізного тесту
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Збірка й наскрізний тест
        run: npm run e2e

      - name: dist відповідає вихідним файлам
        run: |
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ не зібрано з поточного коду — запустіть npm run build і закомітьте dist/"
            exit 1
          fi

      - name: Знімки екрана й PDF із тесту
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e/out
          retention-days: 14
